<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1117" />
  <meta name="description" content="Modern offline calculator with scientific tools, history, memory, and optional live currency conversion." />
  <title>Modern Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">CALCULATOR</div>
        <h1>Modern</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="themeBtn" aria-label="Change theme">◐</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Open settings">⚙</button>
      </div>
    </header>

    <section class="display-card" aria-live="polite">
      <div class="display-meta"><span id="angleLabel">DEG</span><span id="memoryLabel" class="hidden">M</span></div>
      <div id="expression" class="expression">0</div>
      <div id="result" class="result">0</div>
    </section>

    <nav class="mode-tabs" aria-label="Calculator mode">
      <button class="mode active" data-mode="basic">Basic</button>
      <button class="mode" data-mode="scientific">Scientific</button>
      <button class="mode" data-mode="tools">Tools</button>
    </nav>

    <section id="basicPanel" class="panel">
      <div class="memory-row">
        <button data-action="mc">MC</button><button data-action="mr">MR</button><button data-action="mplus">M+</button><button data-action="mminus">M−</button>
      </div>
      <div class="keypad">
        <button class="utility" data-action="clear">AC</button><button class="utility" data-action="backspace">⌫</button><button class="utility" data-action="percent">%</button><button class="operator" data-value="÷">÷</button>
        <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="×">×</button>
        <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="−">−</button>
        <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
        <button class="utility" data-action="sign">±</button><button data-value="0">0</button><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
      </div>
    </section>

    <section id="scientificPanel" class="panel hidden">
      <div class="scientific-grid">
        <button data-value="sin(">sin</button><button data-value="cos(">cos</button><button data-value="tan(">tan</button><button data-value="log(">log</button>
        <button data-value="ln(">ln</button><button data-value="√(">√</button><button data-value="π">π</button><button data-value="(">(</button>
        <button data-value=")">)</button><button data-value="^2">x²</button><button data-value="^">xʸ</button><button data-action="angle">DEG</button>
      </div>
      <div class="memory-row">
        <button data-action="mc">MC</button><button data-action="mr">MR</button><button data-action="mplus">M+</button><button data-action="mminus">M−</button>
      </div>
      <div class="keypad">
        <button class="utility" data-action="clear">AC</button><button class="utility" data-action="backspace">⌫</button><button class="utility" data-action="percent">%</button><button class="operator" data-value="÷">÷</button>
        <button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button class="operator" data-value="×">×</button>
        <button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button class="operator" data-value="−">−</button>
        <button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="operator" data-value="+">+</button>
        <button class="utility" data-action="sign">±</button><button data-value="0">0</button><button data-action="decimal">.</button><button class="equals" data-action="equals">=</button>
      </div>
    </section>

    <section id="toolsPanel" class="panel hidden">
      <div class="tool-card">
        <div><span class="badge offline">OFFLINE</span><h2>Unit converter</h2><p>Length, weight and temperature without internet.</p></div>
        <select id="unitType"><option value="length">Length</option><option value="weight">Weight</option><option value="temperature">Temperature</option></select>
        <div class="converter-row"><input id="unitInput" inputmode="decimal" value="1" /><select id="unitFrom"></select><span>→</span><select id="unitTo"></select></div>
        <div id="unitResult" class="tool-result">—</div>
      </div>
      <div class="tool-card">
        <div><span class="badge online">ONLINE</span><h2>Currency</h2><p>Live exchange rates. Requires internet only when you use it.</p></div>
        <div class="converter-row"><input id="currencyAmount" inputmode="decimal" value="1" /><select id="currencyFrom"><option>USD</option><option>EUR</option><option>GBP</option><option>INR</option><option>JPY</option><option>AUD</option><option>CAD</option></select><span>→</span><select id="currencyTo"><option>INR</option><option>USD</option><option>EUR</option><option>GBP</option><option>JPY</option><option>AUD</option><option>CAD</option></select></div>
        <button id="currencyBtn" class="primary-btn">Get live rate</button>
        <div id="currencyResult" class="tool-result">No live rate loaded.</div>
      </div>
    </section>

    <section class="history-card">
      <div class="section-head"><h2>History</h2><button id="clearHistory" class="text-btn">Clear</button></div>
      <div id="historyList" class="history-list"><div class="empty">Your calculations will appear here.</div></div>
    </section>

    <div id="toast" class="toast" role="status"></div>
  </main>

  <dialog id="settingsDialog">
    <div class="dialog-head"><h2>Settings</h2><button id="closeSettings" class="icon-btn">×</button></div>
    <label>Theme<select id="themeSelect"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label>
    <label>Angle mode<select id="angleSelect"><option value="DEG">Degrees</option><option value="RAD">Radians</option></select></label>
    <label class="switch-row"><span>Haptic feedback</span><input type="checkbox" id="hapticToggle" checked /></label>
    <button id="shareResult" class="primary-btn">Share current result</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
